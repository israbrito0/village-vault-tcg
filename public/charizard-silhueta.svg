<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800">
  <!-- Silhueta estilizada de um dragão de fogo, de perfil, olhando para a esquerda.
       As cores marcam as regiões: laranja = corpo, creme = barriga, azul-petróleo = membrana
       das asas, amarelo/vermelho = chama. Os pontos de luz do topo do site são amostrados daqui. -->
  <g fill="#e8702a">
    <!-- asa de trás: leque com três dedos e membrana recortada -->
    <path fill="#1f7a8c" d="M600 380 L690 110 Q760 160 850 140 Q900 220 950 290 Q880 320 900 420 Q830 400 780 470 Q720 440 700 400 Z"/>
    <path d="M600 380 L690 110 L712 122 L640 400 Z"/>
    <path d="M690 110 L850 140 L846 158 L692 132 Z"/>
    <path d="M690 110 L950 290 L938 300 L688 130 Z"/>
    <path d="M690 110 L900 420 L884 424 L686 130 Z"/>
    <path d="M690 110 L780 470 L764 470 L684 128 Z"/>
    <!-- asa da frente: um pouco menor e mais baixa -->
    <path fill="#1f7a8c" d="M560 410 L630 170 Q700 210 790 190 Q830 270 880 330 Q810 350 830 440 Q770 420 730 490 Q670 460 650 420 Z"/>
    <path d="M560 410 L630 170 L652 182 L600 430 Z"/>
    <path d="M630 170 L790 190 L788 208 L632 192 Z"/>
    <path d="M630 170 L880 330 L868 340 L628 190 Z"/>
    <path d="M630 170 L830 440 L814 444 L626 190 Z"/>
    <path d="M630 170 L730 490 L714 490 L624 188 Z"/>
    <!-- cauda: grossa na base, afinando e subindo à direita -->
    <path d="M590 540 C 680 620, 800 640, 860 560 C 890 520, 880 470, 870 440 L 846 448 C 858 480, 862 520, 836 546 C 790 590, 690 570, 620 500 Z"/>
    <!-- chama da cauda -->
    <path fill="#ffb300" d="M858 452 C 810 400, 830 330, 890 280 C 878 340, 912 360, 920 310 C 960 370, 950 440, 900 472 C 885 480, 866 470, 858 452 Z"/>
    <path fill="#ff4d1a" d="M872 452 C 848 420, 862 375, 892 345 C 886 380, 906 392, 912 368 C 928 400, 922 440, 900 456 C 890 462, 878 460, 872 452 Z"/>
    <!-- pernas grossas com pés -->
    <path d="M490 560 C 455 600, 445 650, 455 700 L 420 722 L 515 726 L 535 700 C 540 650, 540 600, 560 570 Z"/>
    <path d="M590 570 C 615 610, 625 660, 615 700 L 600 724 L 690 722 L 672 700 C 668 650, 650 600, 630 560 Z"/>
    <!-- corpo -->
    <ellipse cx="545" cy="475" rx="130" ry="150"/>
    <ellipse fill="#f6d9a0" cx="480" cy="490" rx="68" ry="112"/>
    <!-- braço com garras -->
    <path d="M470 400 C 430 425, 405 455, 400 485 L 370 480 L 372 500 L 396 512 L 418 505 C 425 475, 450 450, 490 432 Z"/>
    <!-- pescoço -->
    <path d="M425 300 C 470 320, 500 370, 520 430 L 455 440 C 445 395, 420 360, 385 340 Z"/>
    <path fill="#f6d9a0" d="M410 335 C 440 355, 455 385, 465 425 L 452 440 C 440 400, 425 375, 400 350 Z"/>
    <!-- cabeça com focinho comprido e boca aberta -->
    <path d="M430 225 C 475 225, 495 260, 488 300 C 482 330, 460 350, 425 348 L 395 345 L 330 345 L 300 350 L 250 342 L 300 330 L 340 322 L 250 300 L 320 292 L 360 278 C 375 250, 400 225, 430 225 Z"/>
    <path fill="#6b2a10" d="M300 330 L 250 342 L 300 350 L 330 345 L 340 322 Z"/>
    <!-- chifres apontando para trás -->
    <path d="M455 232 L 500 178 L 484 250 Z"/>
    <path d="M478 258 L 535 215 L 500 278 Z"/>
  </g>
</svg>
